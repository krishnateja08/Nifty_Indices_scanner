name: Nifty Indices Scanner
on:
  schedule:
    # Run at 9:30 AM IST (4:00 AM UTC)
    - cron: '6 4 * * 1-5'
    # Run at 4:40 PM IST (11:10 AM UTC)
    - cron: '10 11 * * 1-5'
  workflow_dispatch:
jobs:
  market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pytz twilio tabulate curl_cffi
    - name: Display IST Time
      run: |
        echo "🕒 Current UTC Time: $(date -u)"
        echo "🕒 Current IST Time: $(TZ='Asia/Kolkata' date)"
    - name: Run Market Intelligence Scanner (Neon Cyan Theme)
      env:
        PYTHONUNBUFFERED: "1"
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        TWILIO_SID: ${{ secrets.TWILIO_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        TWILIO_TO: ${{ secrets.TWILIO_TO }}
      run: |
        python -u Nifty_indices_scanner.py
    - name: Persist sector cache
      run: |
        # FIX-9: sector_cache.json holds the last-known-good index data so
        # a throttled run can fall back to it instead of showing nothing.
        # It must be committed on the working branch (not gh-pages, which
        # gets wiped/replaced each deploy) so it survives to the next run.
        if [ -f "sector_cache.json" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sector_cache.json
          if git diff --staged --quiet; then
            echo "ℹ️ Cache unchanged — nothing to commit"
          else
            git commit -m "🗄️ Update sector cache - $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"
            git push origin HEAD
            echo "✅ sector_cache.json committed"
          fi
        else
          echo "⚠️ sector_cache.json not found — skipping"
        fi
    - name: Verify index.html was generated
      run: |
        if [ -f "index.html" ]; then
          echo "✅ index.html generated successfully"
          echo "📊 File size: $(wc -c < index.html) bytes"
        else
          echo "❌ ERROR: index.html not found!"
          exit 1
        fi
    - name: Deploy index.html to GitHub Pages
      run: |
        # ── Step 1: Save generated file before any branch operations ──
        cp index.html /tmp/index.html
        echo "✅ index.html backed up to /tmp/"
        # ── Step 2: Configure git ──
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # ── Step 3: Fetch all remote branches ──
        git fetch origin
        # ── Step 4: Switch to gh-pages (stash working tree first to avoid conflicts) ──
        git stash --include-untracked 2>/dev/null || true
        if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
          echo "📄 Checking out existing gh-pages branch"
          git checkout -B gh-pages origin/gh-pages
        else
          echo "🆕 Creating new orphan gh-pages branch"
          git checkout --orphan gh-pages
          git rm -rf . --quiet 2>/dev/null || true
        fi
        # ── Step 5: Copy the fresh index.html into gh-pages ──
        cp /tmp/index.html ./index.html
        # ── Step 6: Commit and push ──
        git add index.html
        if git diff --staged --quiet; then
          echo "ℹ️ No changes to commit — report is identical to last run"
        else
          git commit -m "🌊 Neon Cyan Theme Update - $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')"
          git push origin gh-pages --force
          echo "✅ Successfully deployed to GitHub Pages"
        fi
    - name: Upload execution logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs-${{ github.run_number }}
        path: |
          *.log
          index.html
        retention-days: 7
